# Full stack: PostgreSQL + API + Web.
# Expects the frontend repo to be cloned next to this one:
#   ./meeting-manager-backend   (this repo)
#   ./meeting-manager-frontend
# Run the DB only for local development with: docker compose up -d db
name: meeting-manager

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: meeting
      POSTGRES_PASSWORD: meeting
      POSTGRES_DB: meeting_manager
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meeting -d meeting_manager"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 4000
      DB_DRIVER: postgres
      DATABASE_URL: postgres://meeting:meeting@db:5432/meeting_manager
      JWT_SECRET: ${JWT_SECRET:-please-change-me-in-production}
      JWT_EXPIRES_IN: 1d
      CORS_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      SEED_DEMO_DATA: "true"
    ports:
      - "4000:4000"

  web:
    build:
      context: ../meeting-manager-frontend
      args:
        # Baked into the client bundle; must be reachable from the browser.
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:4000/api}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:3000"

volumes:
  pgdata:
